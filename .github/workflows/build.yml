name: build

on:
  pull_request:
  push:
    branches:
      - master

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: Relevant changes
    runs-on: ubuntu-latest

    outputs:
      run: ${{ steps.filter.outputs.run }}
      mutation: ${{ steps.filter.outputs.mutation }}

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Detect relevant changes
        id: filter
        env:
          EVENT_NAME: ${{ github.event_name }}
          BEFORE_SHA: ${{ github.event.before }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          if [ "$EVENT_NAME" = "pull_request" ]; then
            BASE="$BASE_SHA"
          elif [ "$BEFORE_SHA" = "0000000000000000000000000000000000000000" ]; then
            # First push to a new branch: there is no base to diff against, so
            # every filter says yes. Both outputs must be set here — an unset
            # one reads as false downstream and silently skips its job.
            echo "run=true" >> "$GITHUB_OUTPUT"
            echo "mutation=true" >> "$GITHUB_OUTPUT"
            exit 0
          else
            BASE="$BEFORE_SHA"
          fi

          if git diff --quiet "$BASE" "$GITHUB_SHA" -- \
            src tests config examples composer.json testo.php psalm.xml \
            rector.php .php-cs-fixer.php infection.json5 \
            .github/workflows/build.yml; then
            echo "run=false" >> "$GITHUB_OUTPUT"
          else
            echo "run=true" >> "$GITHUB_OUTPUT"
          fi

          # Mutation is by far the most expensive job, so it gets a narrower
          # filter than the rest: only what can change which mutants exist or
          # which tests kill them. Style and static-analysis configs, examples
          # and this workflow cannot. Explicit trade: editing the mutation STEP
          # here no longer re-runs it — a break surfaces on the next source
          # change or a manual re-run, which beats paying the full mutation run
          # on every docs and CI edit.
          if git diff --quiet "$BASE" "$GITHUB_SHA" -- \
            src tests composer.json testo.php infection.json5; then
            echo "mutation=false" >> "$GITHUB_OUTPUT"
          else
            echo "mutation=true" >> "$GITHUB_OUTPUT"
          fi

  build:
    name: PHP ${{ matrix.php }}
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        php:
          - '8.3'
          - '8.4'
          - '8.5'
          - '8.6'

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup PHP
        uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none
          extensions: json, mbstring
          tools: composer:v2

      - name: Cache Composer dependencies
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.composer/cache
          key: composer-${{ runner.os }}-${{ hashFiles('**/composer.json') }}
          restore-keys: composer-${{ runner.os }}-

      # roave/backward-compatibility-check and maglnet/composer-require-checker
      # pin "php": "~8.4.0 || ~8.5.0", so on 8.6 they are dropped instead of
      # installing everything with --ignore-platform-req (which would also hide
      # a real runtime dependency that refuses 8.6). Neither is needed here:
      # the BC check has its own job, require-checker runs on 8.3-8.5. Remove
      # this step once both allow 8.6. See docs/php-8.6-rollout-status.md.
      - name: Drop dev tools without PHP 8.6 support
        if: ${{ matrix.php == '8.6' }}
        run: >-
          composer remove --dev --no-update --no-interaction
          roave/backward-compatibility-check maglnet/composer-require-checker

      - name: Install dependencies
        run: composer install --no-interaction --no-progress --prefer-dist

      - name: Build
        if: ${{ matrix.php != '8.6' }}
        run: composer build

      # `composer build` minus cs (php-cs-fixer refuses 8.6 syntax) and minus
      # require-checker (dropped above). Style and require-checker are covered
      # by the 8.3-8.5 jobs. Switch to `composer build` once both support 8.6.
      - name: Build (PHP 8.6)
        if: ${{ matrix.php == '8.6' }}
        run: |
          composer validate --strict
          composer normalize --dry-run
          composer psalm
          composer test

  prefer-lowest:
    name: Prefer lowest
    needs: changes
    if: ${{ !cancelled() && (needs.changes.result != 'success' || needs.changes.outputs.run == 'true') }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup PHP
        uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # v2
        with:
          php-version: '8.3'
          coverage: none
          extensions: json, mbstring
          tools: composer:v2

      - name: Cache Composer dependencies
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.composer/cache
          key: composer-${{ runner.os }}-${{ hashFiles('**/composer.json') }}
          restore-keys: composer-${{ runner.os }}-

      - name: Install dependencies
        run: composer update --prefer-lowest --prefer-stable --no-interaction --no-progress

      - name: Build
        run: composer build

  coverage:
    name: Coverage & Mutation
    needs: changes
    if: ${{ !cancelled() && (needs.changes.result != 'success' || needs.changes.outputs.mutation == 'true') }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup PHP
        uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # v2
        with:
          php-version: '8.4'
          coverage: pcov
          extensions: json, mbstring
          tools: composer:v2

      - name: Cache Composer dependencies
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.composer/cache
          key: composer-${{ runner.os }}-${{ hashFiles('**/composer.json') }}
          restore-keys: composer-${{ runner.os }}-

      - name: Install dependencies
        run: composer install --no-interaction --no-progress --prefer-dist

      - name: Restore property regression corpus
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: build/property-db
          key: property-db-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: property-db-

      - name: Test with coverage
        run: composer test:coverage:ci
        env:
          PROPERTY_DB: ${{ github.workspace }}/build/property-db

      - name: Save property regression corpus
        if: ${{ !cancelled() }}
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: build/property-db
          key: property-db-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Mutation testing
        run: composer mutation

  compatibility:
    name: Backward compatibility
    needs: changes
    if: ${{ !cancelled() && (needs.changes.result != 'success' || needs.changes.outputs.run == 'true') }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Setup PHP
        uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # v2
        with:
          # roave compares the two revisions' sources statically, so one PHP
          # version is enough; 8.5 is the newest it installs on (~8.4 || ~8.5).
          php-version: '8.5'
          coverage: none
          extensions: json, mbstring, bcmath, intl
          tools: composer:v2

      - name: Cache Composer dependencies
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.composer/cache
          key: composer-${{ runner.os }}-${{ hashFiles('**/composer.json') }}
          restore-keys: composer-${{ runner.os }}-

      - name: Install dependencies
        run: composer install --no-interaction --no-progress --prefer-dist

      - name: Backward compatibility check
        # rector/rector's composer autoload is files-only (classes load through
        # rector's own scoped autoloader), so roave cannot reflect
        # AbstractRector-derived symbols and reports them as "[BC] SKIPPED ...
        # could not be found in the located source", counting each as a break.
        # Tolerate runs where every finding is SKIPPED; any real [BC] break
        # still fails.
        run: |
          LATEST="$(git describe --tags --abbrev=0 2>/dev/null || true)"
          if [ -z "$LATEST" ]; then
            echo "No previous tag - skipping BC check"
            exit 0
          fi
          CODE=0
          OUT=$(composer bc-check -- --from="$LATEST" --install-development-dependencies 2>&1) || CODE=$?
          echo "$OUT"
          if [ "$CODE" -ne 0 ]; then
            if [ "$CODE" -ne 3 ]; then
              exit "$CODE"
            fi
            if ! echo "$OUT" | grep -q '^\[BC\] SKIPPED'; then
              exit "$CODE"
            fi
            if echo "$OUT" | grep '^\[BC\] ' | grep -qv '^\[BC\] SKIPPED'; then
              exit "$CODE"
            fi
            echo "Only SKIPPED findings (unresolvable rector internals) - treating as pass"
          fi
